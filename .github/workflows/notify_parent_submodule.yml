name: Notify Parent Submodules

on:
  push:
    branches: [ v1.6.0 ]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_ACTIONS }}
          repository: KEPM-PGSEnergy/lin_apk_tx_rx
          event-type: update_submodule_event
